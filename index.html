<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo | DRL Express</title>
<meta property="og:title" content="Equipo DRL Express & Logística">
<meta property="og:description" content="Directorio de tarjetas de contacto del equipo DRL Express.">
<meta property="og:image" content="https://equipo.drlexpresscol.com.co/logo.png">
<meta property="og:url" content="https://equipo.drlexpresscol.com.co/">
<meta property="og:type" content="website">
<style>
  :root{
    --navy:#1A0E45;
    --navy2:#3D1E6B;
    --fuchsia:#C81E7A;
    --orange:#F47920;
    --bg:#F4F2FA;
    --ink:#1A0E45;
    --muted:#6E6785;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    display:flex;justify-content:center;
    min-height:100vh;
  }
  .wrap{
    width:100%;max-width:460px;
    background:#fff;
    min-height:100vh;
    padding:2.4rem 1.6rem;
  }
  .logo{display:block;height:38px;margin:0 auto 2rem;}
  h1{
    text-align:center;font-size:22px;font-weight:800;color:var(--ink);
    margin-bottom:0.4rem;
  }
  p.sub{
    text-align:center;color:var(--muted);font-size:14px;margin-bottom:2rem;
  }
  .member{
    display:flex;align-items:center;gap:14px;
    background:var(--bg);
    border-radius:16px;
    padding:14px 16px;
    text-decoration:none;
    margin-bottom:12px;
    transition:transform .15s ease;
  }
  .member:active{transform:scale(0.98);}
  .avatar{
    width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,var(--navy2),var(--fuchsia));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:18px;flex-shrink:0;
  }
  .info .name{font-weight:700;color:var(--ink);font-size:15px;}
  .info .role{font-size:13px;color:var(--muted);}
  .arrow{margin-left:auto;color:var(--muted);font-size:18px;}
  footer{
    text-align:center;margin-top:2.4rem;font-size:12px;color:var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="DRL Express">
    <h1>Equipo DRL Express</h1>
    <p class="sub">Selecciona un contacto para ver su tarjeta</p>

    <a class="member" href="/david/">
      <div class="avatar">DR</div>
      <div class="info">
        <div class="name">David Ramos</div>
        <div class="role">CEO, DRL Express &amp; Logística</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <footer>DRL Express &amp; Logística</footer>
  </div>
</body>
</html>
